# askchem.service drop-in for the v2 retrieval stack (post-2026-05-18 8 vCPU / 32 GB).
#
# Installed on the VPS as
#   /etc/systemd/system/askchem.service.d/override.conf
# by deploy_to_vps.sh (rsync + systemctl daemon-reload + restart).
#
# Coexists with the other drop-ins (loaded in lexicographic order;
# last-key-wins on duplicates):
#   clerk.conf      Clerk auth keys
#   memory.conf     MALLOC_ARENA_MAX=2 + OMP_NUM_THREADS=2 (the 2-vCPU
#                   defaults; this override.conf supersedes OMP/OPENBLAS
#                   to 6 after the May-18 resize, since override.conf
#                   loads after memory.conf and last-key-wins)
#   modal.conf      REMOVED 2026-05-18 (Modal dependency dropped; the
#                   only thing it held was CHEMTREE_REMOTE_AUTH_TOKEN
#                   for the Modal T4 rerank endpoint)
#   override.conf   the file you're reading
#
# ─────────────────────────────────────────────────────────────────────
# 2026-05-18: DO upgrade + Modal drop
# ─────────────────────────────────────────────────────────────────────
# Droplet resized from s-4vcpu-16gb-amd to s-8vcpu-32gb-intel ($192/mo
# Premium Intel, 8 vCPU Cascade Lake / 32 GB RAM / 640 GB NVMe, same
# public IP YOUR_VPS_HOST).
#
# Three coordinated changes shipped together:
#
# 1. Modal cross-encoder offload is OFF for internal testing. The
#    Modal T4 rerank endpoint stays deployed (askchem-search-gpu app
#    on the by2192 workspace), but askchem no longer calls it.
#    Cross-encoder rerank runs locally on the now-8 vCPU box. The
#    eval at data/eval/modal_gpu_2026-05-15.md showed local CPU
#    rerank at 4 vCPU was 334 ms at batch=30; on 8 Intel vCPU we
#    expect ~250-300 ms — comparable to the prior Modal hop (287 ms
#    median + 50-150 ms RTT). The big win is eliminating the 5-20 s
#    Modal cold-start tail that hit ~10-15% of queries today.
#
# 2. FAISS flipped to native 1024-d resident. With 32 GB RAM the
#    9.6 GB IndexFlatIP fits comfortably resident; dropping the mmap
#    saves ~100 ms per query and recovers the ~0.001 nDCG@10 the
#    256-d Matryoshka gave up.
#
# 3. CPU thread budgets bumped 4 → 6 (OMP / OPENBLAS / FAISS_THREADS).
#    Leaves 2 cores for nginx + SQLite + OS without oversubscribing.
#
# Expected result (vs the prior 4 vCPU + Modal config):
#   cold p50  2.7  s → ~1.5 s (~40%)
#   cold p95  5.3  s → ~3   s
#   Modal cold-start outliers eliminated (10-15% of queries no longer
#     wait 7-22 s for Modal warmup)
#   cache-weighted p50 (with bumped LRU): ~0.3-0.6 s
#   nDCG@10 unchanged or +0.001 (1024-d vs 256-d)
#
# ─────────────────────────────────────────────────────────────────────
# Rollback to the 256-d / Modal-on / 4-vCPU config
# ─────────────────────────────────────────────────────────────────────
# If the upgrade misbehaves:
#   1. Restore /etc/systemd/system/askchem.service.d/modal.conf with
#      the prior CHEMTREE_REMOTE_AUTH_TOKEN line (kept in a local
#      backup outside the repo).
#   2. Below: un-comment CHEMTREE_REMOTE_RERANK_URL +
#      CHEMTREE_REMOTE_TIMEOUT_S, CHEMTREE_V2_DIM=256,
#      CHEMTREE_FAISS_MMAP=1; flip the four thread vars 6 → 4.
#   3. systemctl daemon-reload && systemctl restart askchem.
#
# To roll back the droplet itself: `doctl compute droplet-action
# restore <droplet-id> --image-id askchem-pre-resize-<date>`.
#
# ─────────────────────────────────────────────────────────────────────
# Knob inventory (kept in sync with src/chemtree/retrieval.py +
# src/chemtree/embeddings_v2.py)
# ─────────────────────────────────────────────────────────────────────
#
#   CHEMTREE_RETRIEVER_VERSION=v2
#     Route the dense channel through chemtree.embeddings_v2 (mxbai-
#     embed-large-v1, CLS pooled). v1 = legacy all-MiniLM-L6-v2 path
#     stays as the fallback if v2 artefacts ever go missing.
#
#   CHEMTREE_V2_DIM  (unset = 0 = full 1024-d, May 18)
#     When unset, embeddings_v2 loads data/claim_embeddings.v2.faiss
#     (the native 1024-d IndexFlatIP, 9.6 GB resident on the 32 GB
#     box) and queries flow through mxbai without truncation. Set to
#     256 to fall back to data/claim_embeddings.v2_256.faiss (2.2 GB,
#     Matryoshka-truncated + L2-renormalised at request time).
#
#   CHEMTREE_RERANK_ENABLED=1
#     Turn on the ms-marco-MiniLM-L-6-v2 cross-encoder rerank stage.
#     Runs locally on CPU (Modal offload is off as of 2026-05-18).
#
#   CHEMTREE_FAISS_MMAP=0  (2026-05-18; was =1 before)
#     Must be set explicitly: the loader in embeddings_v2.py defaults
#     to mmap=1 when this var is unset. With 32 GB RAM and a 2.2 GB
#     256-d index, resident is the right call — startup pays only ~7s
#     and queries get consistent latency with no disk-fault overhead.
#     Flip to 1 if memory pressure ever becomes a problem (unlikely
#     at 10 concurrent users or below).
#
#   CHEMTREE_FAISS_THREADS=6
#     IndexFlatIP is embarrassingly parallel; matches the OMP=6
#     budget so FAISS uses 6 of the 8 cores without oversubscribing
#     the cross-encoder.
#
#   CHEMTREE_KEEP_EMBEDDINGS=0
#     Default. We load claim_ids from the sidecar npy via mmap and
#     never materialise the npz on the heap.
#
# Bandaid kill-switches (δ2). All default to "filter on". Flip to 1 to
# disable; safe to ablate on prod against real query logs.
#
#   CHEMTREE_DISABLE_TECHNIQUE_STRIPPER
#   CHEMTREE_DISABLE_COUPLING_INTENT_OVERRIDE
#   CHEMTREE_DISABLE_WEAK_STEM_SKIP
#   CHEMTREE_DENSE_MIN_SCORE       (default 0.20 — leave unset)
#   CHEMTREE_TREE_MIN_SCORE        (default 0.10 — leave unset)
#
# Leave SEARCH_PROFILE off in prod (adds ~100 µs of logging per query
# and clutters journald).
#   CHEMTREE_SEARCH_PROFILE=0
#
# ─────────────────────────────────────────────────────────────────────
# CHEMTREE_DISABLE_PAW=1  (May-14 ablation,
#   docs/plans/2026-05-14-paw-off-and-int8-ablation.md)
# ─────────────────────────────────────────────────────────────────────
# Disables programasweights entirely. paw_functions._check_paw()
# short-circuits to False, so classify_intent / normalize_query /
# is_relevant / detect_contradiction / expand_query / decompose_query
# all fall through to their built-in fallbacks (intent → "concept",
# normalize → identity, is_relevant → True, contradiction → "unclear",
# expand → [query], decompose → [query]).
#
# Frees the two qwen3-0.6b-q6_k.gguf instances (~640 MB resident). The
# ~1.4 GB on-disk cache at /root/.cache/programasweights/ is left in
# place for instant rollback (`unset CHEMTREE_DISABLE_PAW` + restart).
#
# Quality: nDCG@10 unchanged at 0.753 vs 0.753 baseline across 80
# probes / 7,483 graded labels (per-family deltas inside ±0.011).
# MRR@20 drifted 0.895 → 0.892, within noise. Coupling/homonym intent
# is preserved by the rule-based override in server._get_intent.

[Service]
# 2026-07-07: package renamed chemtree -> askchem. Override ExecStart to run the
# renamed module (env vars stay CHEMTREE_* - only the Python package changed).
ExecStart=
ExecStart=/opt/askchem/venv/bin/uvicorn askchem.server:app --host 127.0.0.1 --port 8420 --workers 1
# 2026-07-07: DB file renamed chemtree.db -> askchem.db. The base unit still
# sets CHEMTREE_DB=/opt/askchem/chemtree.db; this drop-in loads later and wins,
# pointing the app at the migrated DB so a fresh deploy is correct.
Environment=CHEMTREE_DB=/opt/askchem/askchem.db
Environment=CHEMTREE_RETRIEVER_VERSION=v2
# 2026-05-18: keep Matryoshka 256-d. Initially flipped to native
# 1024-d resident, but profiling on 8 Intel vCPU showed FAISS search
# at 1024-d is ~800 ms (memory-bandwidth-bound: 9.6 GB index / ~20 GB/s
# bandwidth ≈ 480 ms theoretical floor on this hardware, ~800 ms
# measured). At 256-d the index is 2.2 GB and FAISS search is
# ~100-200 ms — a 600 ms cold-path win for the 1% nDCG@10 trade-off
# that 1024-d would buy. The 256-d sidecar at
# data/claim_embeddings.v2_256.faiss is what gets loaded.
Environment=CHEMTREE_V2_DIM=256
Environment=CHEMTREE_RERANK_ENABLED=1
# May-15 ablation: shrink cross-encoder rerank window 50 -> 30.
# nDCG@10 -0.5% (0.751 -> 0.747, well inside the 2% bar) for -41% p50
# latency. Biggest single cold-pass latency lever.
Environment=CHEMTREE_RERANK_WINDOW=30
# 2026-05-18: truncate cross-encoder inputs to 128 tokens (default 512).
# Profiling on 8 Intel vCPU showed isolated rerank predict on 30 pairs:
#   max_len=512 (default): 1087 ms in-service
#   max_len=256          :  870 ms in-service  (~20% off)
#   max_len=128          :  430 ms in-service  (~60% off)
# Synthetic-text microbench was 147 ms at any max_len, confirming the
# in-service cost is dominated by real claim text length. ms-marco-
# MiniLM cross-encoders are robust to truncation at 128 (their training
# distribution skews short); chemistry claim text averages ~100-150
# tokens with a long tail. Validate the quality side via the 80-probe
# eval before treating this as final. Roll back: set =256 or remove.
Environment=CHEMTREE_RERANK_MAX_LEN=128
# May-15 ablation: disable pseudo-relevance feedback. The 8 extra FTS
# queries diffused focus on the 80-probe eval set; killing PRF
# *improved* nDCG@10 by +4.0% AND cut median pre_rerank latency by
# ~407 ms. Roll back via ``unset CHEMTREE_DISABLE_PRF`` + restart.
Environment=CHEMTREE_DISABLE_PRF=1
# May-15 ablation: disable tree _semantic_rerank_. Reconstructing up
# to ~800 vectors from the FAISS mmap for tree-pool reranking was a
# tail-latency contributor. nDCG@10 +0.5% (neutral / slight win),
# p95 -15%.
Environment=CHEMTREE_DISABLE_TREE_RERANK=1
# 2026-05-18: FAISS mmap explicitly OFF (was =1). The default in
# embeddings_v2._load_or_build_faiss_index is mmap=1 when unset, so
# we have to set =0 explicitly. With 32 GB RAM, loading the 9.6 GB
# IndexFlatIP resident saves ~100 ms per query under memory pressure.
# Startup adds ~30-60 s vs the mmap fast-path; acceptable on a long-
# lived service. Rollback: set =1 or remove the line.
Environment=CHEMTREE_FAISS_MMAP=0
Environment=CHEMTREE_FAISS_THREADS=6
Environment=CHEMTREE_KEEP_EMBEDDINGS=0
Environment=CHEMTREE_SEARCH_PROFILE=0
Environment=CHEMTREE_DISABLE_PAW=1
# 2026-05-18: bumped TTL 600 -> 86400 (24 h) and size 1024 -> 2048
# for the internal-testing phase. ~10 testers hitting a small set of
# queries means an aggressive LRU pushes cache-hit p50 to <50 ms
# while keeping cold-path freshness fine for an unchanging index.
# Revisit (likely shorter TTL) before public launch.
Environment=CHEMTREE_SEARCH_CACHE=1
Environment=CHEMTREE_SEARCH_CACHE_SIZE=2048
Environment=CHEMTREE_SEARCH_CACHE_TTL_S=86400
# May-15 ablation A2: int8 dynamic-quantize the cross-encoder. DISABLED
# 2026-05-15 -- on prod (Python 3.12, transformers 4.49.x), the
# quantized BertForSequenceClassification raises AttributeError in
# tokenization_utils_base.__getattr__ during CrossEncoder.predict
# (BatchEncoding<->dict mismatch). Without int8, the rerank silently
# skipped on every request (caught by the try/except in db.py
# search_claims). Leave unset until we either pin transformers or move
# to a quantization path that goes through model.eval() + a custom
# predict loop. fp32 rerank stays on via CHEMTREE_RERANK_ENABLED=1.
# Environment=CHEMTREE_RERANK_QUANT=int8
# 2026-05-18: bumped 4 -> 6 after the 8 vCPU resize. Leaves 2 cores
# for nginx + SQLite + OS without oversubscribing.
Environment=OMP_NUM_THREADS=6
Environment=OPENBLAS_NUM_THREADS=6
# ─────────────────────────────────────────────────────────────────────
# Phase 4 (Modal GPU rerank) — DISABLED 2026-05-18
# Plan: .cursor/plans/modal_gpu_search_acceleration_b6f08145.plan.md
# Findings: data/eval/modal_gpu_2026-05-15.md
# ─────────────────────────────────────────────────────────────────────
# History: Phase 4 offloaded the cross-encoder rerank stage to a Modal
# T4 endpoint, cutting end-to-end p50 from 4701 ms to 2708 ms (-42%).
# Deployed 2026-05-15. Disabled 2026-05-18 after the DO 8 vCPU resize
# made local CPU rerank competitive AND because Modal min_containers=0
# cold-starts were adding 5-20 s to ~10-15% of queries.
#
# The askchem-search-gpu Modal app stays deployed (no cost at
# min_containers=0). Flip back by re-adding the two env vars below
# AND restoring /etc/systemd/system/askchem.service.d/modal.conf with
# the CHEMTREE_REMOTE_AUTH_TOKEN line. All call sites in
# src/chemtree/retrieval.py auto-fall-back to local CPU when
# CHEMTREE_REMOTE_RERANK_URL is empty.
#
# Environment=CHEMTREE_REMOTE_RERANK_URL=https://by2192--askchem-search-gpu-searchgpu-rerank-v1.modal.run
# Environment=CHEMTREE_REMOTE_TIMEOUT_S=8
