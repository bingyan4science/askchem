[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "askchem"
version = "0.3.0"
description = "Python SDK for AskChem — the structured knowledge API for chemistry"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "AskChem Team" },
]
keywords = ["chemistry", "knowledge-graph", "scientific-claims", "ai-agents", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://askchem.org"
Documentation = "https://askchem.org/api/docs"

[tool.hatch.build.targets.wheel]
packages = ["askchem"]
